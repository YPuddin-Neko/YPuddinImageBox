[package]
name = "imagebox"
version = "0.1.0"
description = "Booru 图片下载与管理"
authors = ["YPuddin"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "imagebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query", "gzip", "socks"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
# 聚合搜索时几个站点一起请求（join_all）；依赖树里本来就有。
futures-util = "0.3"
thiserror = "2"
percent-encoding = "2"
url = "2"
md-5 = "0.11.0"
tauri-plugin-dialog = "2"
# 只开内置 SQLite，不开加载扩展等用不到的能力。
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "macros", "migrate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
keyring = "4.2"
trash = "5"
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.23.1"
machine-uid = "0.6"
getrandom = "0.4"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
# 读取系统首选语言，设置里选「跟随系统」时用。
sys-locale = "0.3"


# 开发版里也要能较快地解码大图、生成缩略图和计算 md5，这几个依赖单独开优化。
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
