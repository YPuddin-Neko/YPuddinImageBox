# 每次推送都在 macOS 和 Windows 上跑单元测试并打包，安装包放在这次运行的「Artifacts」里下载。
# 不签名、不发 Release：macOS 用临时签名（第一次打开要在「隐私与安全性」里允许），Windows 会有 SmartScreen 提示。
name: 构建

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（通用）
            os: macos-latest
            artifact: YPuddinImageBox-macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows（x64）
            os: windows-latest
            artifact: YPuddinImageBox-windows-x64
            rust-targets: ""
            build-args: --bundles nsis
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端回归测试
        run: node --test tests/*.test.mjs

      - name: 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test language --test acl

      - name: 打包
        run: pnpm tauri build ${{ matrix.build-args }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
